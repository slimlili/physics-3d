<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>T2 · 直线边界磁场</title>
<style>
  :root{
    --bg:#080F12; --panel:rgba(12,26,32,.84); --line:rgba(126,214,220,.22);
    --ink:#E4F1F3; --muted:#88A3AA; --brand:#4ADE80; --cyan:#7DD3FC;
    --warn:#F2C14E; --bad:#F87171; --violet:#C4B5FD;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:1;
    background:radial-gradient(ellipse at 50% 47%,transparent 44%,rgba(0,0,0,.5) 100%)}
  .hud{position:fixed;inset:0;pointer-events:none;z-index:2}
  header{position:absolute;left:24px;top:20px;max-width:560px}
  .eyebrow{font-size:11.5px;letter-spacing:.16em;color:var(--brand);opacity:.85;margin:0 0 6px}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.02em}
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:6px;line-height:1.5}
  .readout{position:absolute;left:24px;top:126px;display:grid;gap:7px;font-variant-numeric:tabular-nums}
  .ro{display:flex;align-items:baseline;gap:8px;font-size:12.5px;color:var(--muted)}
  .ro b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:16px;color:var(--ink);font-weight:500}
  .ro span{min-width:96px}

  .panel{position:absolute;right:22px;bottom:22px;pointer-events:auto;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px 12px;backdrop-filter:blur(10px);width:260px}
  .cap{font-size:11px;color:var(--muted);margin:0 0 6px;letter-spacing:.08em}
  .row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .row label{font-size:12.5px;color:var(--muted);width:62px;flex:none;white-space:nowrap}
  .row output{font-family:ui-monospace,monospace;font-size:12.5px;width:38px;text-align:right;color:var(--ink)}
  input[type=range]{flex:1;accent-color:var(--brand);height:20px;background:transparent}
  .seg{display:flex;gap:6px;margin-bottom:10px}
  .seg button,.act button{
    flex:1;font:inherit;font-size:12.5px;padding:6px 8px;border-radius:8px;cursor:pointer;
    background:transparent;color:var(--muted);border:1px solid var(--line);white-space:nowrap;
  }
  .seg button[aria-pressed="true"]{background:rgba(74,222,128,.14);border-color:var(--brand);color:var(--brand)}
  .act{display:flex;gap:8px}
  .act button:hover{border-color:var(--brand);color:var(--brand)}

  .answer{position:absolute;left:24px;bottom:22px;pointer-events:auto;width:min(440px,calc(100vw - 48px));
    background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
    backdrop-filter:blur(10px);display:none}
  .answer.on{display:block}
  .answer h2{font-size:13px;margin:0 0 10px;color:var(--brand);letter-spacing:.06em}
  .answer .f{font-family:ui-monospace,Menlo,monospace;color:var(--cyan)}
  .drift{font-size:12px;color:var(--warn);border:1px solid rgba(242,193,78,.35);
    background:rgba(242,193,78,.10);border-radius:8px;padding:6px 9px;margin:0 0 10px}
  .drift[hidden]{display:none}

  .problem{position:absolute;right:22px;top:20px;max-width:min(420px,calc(100vw - 44px));
    pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:10px 14px;backdrop-filter:blur(10px);font-size:12.5px;color:var(--muted)}
  .problem summary{cursor:pointer;color:var(--ink);font-size:12.5px;list-style:none}
  .problem summary::-webkit-details-marker{display:none}
  .problem summary::before{content:"▸ ";color:var(--brand)}
  .problem[open] summary::before{content:"▾ "}
  .problem p{margin:8px 0 0;line-height:1.7;color:var(--muted)}

  .hint{position:absolute;left:24px;bottom:8px;font-size:11px;color:var(--muted);opacity:.55}
  @media (max-width:760px){
    header{left:16px;top:12px;max-width:none;right:16px} h1{font-size:16px} h1 small{font-size:11px}
    .readout{left:16px;top:104px;gap:4px} .ro span{min-width:76px} .ro b{font-size:14px}
    .panel{left:12px;right:12px;bottom:12px;width:auto}
    .answer{left:12px;right:12px;bottom:190px;width:auto}
    .hint{display:none}
  }
</style>
</head>
<body>
<div class="hud">
  <header>
    <p class="eyebrow">磁场 · 三维演示</p>
    <h1>粒子穿过直线边界磁场
      <small>以与边界成 θ 角射入 · 在磁场中走一段圆弧后射出</small>
    </h1>
  </header>

  <div class="readout">
    <div class="ro"><span>轨道半径 r</span><b id="ro-r">—</b></div>
    <div class="ro"><span>圆心角</span><b id="ro-ang">—</b></div>
    <div class="ro"><span>在磁场中时间</span><b id="ro-t">—</b></div>
  </div>

  <details class="problem">
    <summary>题目原文</summary>
    <p>把这道题的题干放在这里。演示默认条件：粒子以与直线边界成 θ 角的速度射入磁场，磁场只存在于边界一侧。</p>
  </details>

  <div class="answer" id="answer">
    <div id="drift" class="drift" hidden>已偏离题目条件，读数仅供参考</div>
    <h2>要点</h2>
    <div id="answer-body" style="font-size:13px;line-height:1.75">
      圆心角：正电荷 <span class="f">Δ = 2π − 2θ</span>；负电荷受力朝磁场外，只转 <span class="f">2θ</span> 就穿出。<br>
      弦长 <span class="f">L = 2r·sinθ</span>，半径 <span class="f">r = mv/(qB)</span>。<br>
      在磁场中时间 <span class="f">t = Δ/ω = Δm/(qB)</span>。
    </div>
  </div>

  <div class="panel">
    <div class="row">
      <label for="v">速率 v</label>
      <input id="v" type="range" min="0.3" max="2.0" step="0.05" value="1">
      <output id="v-out">1.00</output>
    </div>
    <div class="row">
      <label for="b">磁感应 B</label>
      <input id="b" type="range" min="0.5" max="2.5" step="0.05" value="1">
      <output id="b-out">1.00</output>
    </div>
    <div class="seg">
      <button id="q-pos" aria-pressed="true">正电荷 +q</button>
      <button id="q-neg" aria-pressed="false">负电荷 −q</button>
    </div>
    <div class="cap">播放速度</div>
    <div class="seg" id="speed-row">
      <button class="sp" id="btn-speed-0.25" data-s="0.25">¼×</button>
      <button class="sp" id="btn-speed-0.5" data-s="0.5">½×</button>
      <button class="sp" id="btn-speed-1" data-s="1" aria-pressed="true">1×</button>
      <button class="sp" id="btn-speed-2" data-s="2">2×</button>
    </div>
    <div class="seg">
      <button id="btn-answer" aria-pressed="false">看答案</button>
    </div>
    <div class="act">
      <button id="pause">暂停</button>
      <button id="reset">重播</button>
    </div>
  </div>

  <div class="hint">拖动旋转视角 · 滚轮缩放 · 空格暂停 · R 重播</div>
</div>

<script id="expect" type="application/json">{"r": 1, "ang": 300}</script>
<script src="../src/physics.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "../lib/three.module.js",
    "three/addons/controls/OrbitControls.js": "../lib/OrbitControls.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ================= 舞台 ================= */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080F12);
scene.fog = new THREE.Fog(0x080F12, 16, 34);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, -1.6, 5.2);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, -0.6, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 2;
controls.maxDistance = 18;

scene.add(new THREE.AmbientLight(0xa8e6ee, 0.65));
const key = new THREE.DirectionalLight(0xd9fbff, 1.0);
key.position.set(4, 6, 8);
scene.add(key);

/* ================= 工具（与 shell 一致） ================= */
function label3d(text, color = '#9FE6C4', size = 0.3) {
  const c = document.createElement('canvas');
  c.width = c.height = 160;
  const ctx = c.getContext('2d');
  ctx.fillStyle = color;
  ctx.font = 'bold 56px "PingFang SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 80, 82);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false }));
  const w = Math.max(0.18, text.length * 0.16);
  s.scale.set(size * w / 0.3, size, 1);
  return s;
}

function makeArrow(color = 0xF2C14E, len = 0.8) {
  return new THREE.ArrowHelper(new THREE.Vector3(0, 1, 0), new THREE.Vector3(), len, color, 0.14, 0.07);
}

function makeTrail(maxPoints = 4000, color = 0x8CF5C4) {
  const pos = new Float32Array(maxPoints * 3);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setDrawRange(0, 0);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color, transparent: true, depthTest: false }));
  line.renderOrder = 3;
  line.frustumCulled = false;
  let n = 0;
  return {
    line,
    push(p) {
      if (n >= maxPoints) return;
      pos[n * 3] = p.x; pos[n * 3 + 1] = p.y; pos[n * 3 + 2] = p.z;
      n++;
      geo.setDrawRange(0, n);
      geo.attributes.position.needsUpdate = true;
    },
    clear() { n = 0; geo.setDrawRange(0, 0); },
    get count() { return n; },
  };
}

function markDrift(on) {
  const el = document.getElementById('drift');
  if (el) el.hidden = !on;
}

let qDirty = false;
function isDirty() {
  const moved = [...document.querySelectorAll('input[type=range]')]
    .some(el => Math.abs(+el.value - +el.defaultValue) > 1e-9);
  return moved || qDirty;
}

/* ================= 控制 ================= */
let speed = 1;
let paused = false;
let onReset = () => {};

const spBtns = [...document.querySelectorAll('.sp')];
function setSpeed(v) {
  speed = v;
  spBtns.forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.s === v)));
}
spBtns.forEach(b => b.addEventListener('click', () => setSpeed(+b.dataset.s)));

document.getElementById('pause').addEventListener('click', togglePause);
document.getElementById('reset').addEventListener('click', () => { onReset(); markDrift(isDirty()); });
document.getElementById('btn-answer').addEventListener('click', ev => {
  const on = !document.getElementById('answer').classList.contains('on');
  document.getElementById('answer').classList.toggle('on', on);
  ev.currentTarget.setAttribute('aria-pressed', String(on));
});

function togglePause() {
  paused = !paused;
  document.getElementById('pause').textContent = paused ? '继续' : '暂停';
}

addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  if (e.key === 'r' || e.key === 'R') { onReset(); markDrift(isDirty()); }
});

/* === SCENE === */
const MASS = 1;
const S = { v: 1, B: 1, q: 1, theta: Math.PI / 6, t: 0 };

const radiusOf = () => PHYS.t1.radius({ v: S.v, m: MASS, q: S.q, B: S.B });
const omegaOf = () => Math.abs(PHYS.t1.omega({ m: MASS, q: S.q, B: S.B }));
const angleOf = () => PHYS.t2.centralAngle(S.theta, S.q);
const totalTime = () => PHYS.t2.time({ m: MASS, q: S.q, B: S.B, theta: S.theta });

const v0dir = () => new THREE.Vector3(Math.sin(S.theta), Math.cos(S.theta), 0);

function centerOf() {
  const r = radiusOf();
  const d = v0dir();
  const perp = S.q > 0
    ? new THREE.Vector3(d.y, -d.x, 0)
    : new THREE.Vector3(-d.y, d.x, 0);
  return perp.multiplyScalar(r);
}

function posAt(t) {
  const r = radiusOf();
  if (!r) return v0dir().multiplyScalar(S.v * t);
  const c = centerOf();
  const phi0 = Math.atan2(-c.y, -c.x);
  const sgn = S.q > 0 ? -1 : 1;
  const phi = phi0 + sgn * omegaOf() * t;
  return new THREE.Vector3(c.x + r * Math.cos(phi), c.y + r * Math.sin(phi), 0);
}

function velAt(t) {
  const r = radiusOf();
  if (!r) return v0dir().multiplyScalar(S.v);
  const c = centerOf();
  const phi0 = Math.atan2(-c.y, -c.x);
  const sgn = S.q > 0 ? -1 : 1;
  const phi = phi0 + sgn * omegaOf() * t;
  return new THREE.Vector3(-Math.sin(phi), Math.cos(phi), 0).multiplyScalar(sgn * omegaOf() * r);
}

// 磁场边界（x = 0，竖直）
const boundary = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0, -6, 0), new THREE.Vector3(0, 6, 0)]),
  new THREE.LineDashedMaterial({ color: 0xF2C14E, dashSize: 0.16, gapSize: 0.12 })
);
boundary.computeLineDistances();
scene.add(boundary);
const boundaryLabel = label3d('边界', '#F2C14E', 0.22);
boundaryLabel.position.set(-0.42, 3.4, 0);
scene.add(boundaryLabel);

// 磁场区（x > 0）的磁感线，沿 +z
const fieldGroup = new THREE.Group();
for (let x = 0.5; x <= 4.5; x += 1.0) {
  for (let y = -3; y <= 3; y += 1.0) {
    const a = new THREE.ArrowHelper(new THREE.Vector3(0, 0, 1), new THREE.Vector3(x, y, -0.45), 0.9, 0x5FB3C4, 0.12, 0.06);
    a.line.material.transparent = a.cone.material.transparent = true;
    a.line.material.opacity = 0.16; a.cone.material.opacity = 0.26;
    fieldGroup.add(a);
  }
}
scene.add(fieldGroup);

const particle = new THREE.Mesh(
  new THREE.SphereGeometry(0.075, 28, 20),
  new THREE.MeshStandardMaterial({ color: 0xA7F3D0, emissive: 0x34D399, emissiveIntensity: 2.0, roughness: .35 })
);
scene.add(particle);
const pLight = new THREE.PointLight(0x34D399, 1.4, 4, 2);
scene.add(pLight);

const trail = makeTrail(4000);
scene.add(trail.line);

const vArrow = makeArrow(0xF2C14E, 0.7);
const fArrow = makeArrow(0xF87171, 0.55);
scene.add(vArrow, fArrow);

const inLabel = label3d('入射', '#F2C14E', 0.22);
inLabel.position.set(-0.5, 0.25, 0);
scene.add(inLabel);

const centerDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.045, 12, 10),
  new THREE.MeshBasicMaterial({ color: 0x7DD3FC })
);
scene.add(centerDot);

const radiusLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineDashedMaterial({ color: 0x7DD3FC, dashSize: 0.06, gapSize: 0.06, transparent: true, opacity: .7 })
);
scene.add(radiusLine);

// 弦（入射点 → 出射点）
const chordLine = new THREE.Line(
  new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]),
  new THREE.LineDashedMaterial({ color: 0xC4B5FD, dashSize: 0.07, gapSize: 0.07, transparent: true, opacity: .85 })
);
scene.add(chordLine);

const outDot = new THREE.Mesh(
  new THREE.SphereGeometry(0.045, 12, 10),
  new THREE.MeshBasicMaterial({ color: 0xC4B5FD })
);
scene.add(outDot);

function rebuild() {
  const r = radiusOf();
  const ang = angleOf();
  const t = totalTime();

  document.getElementById('ro-r').textContent = r ? r.toFixed(2) : '—';
  document.getElementById('ro-ang').textContent = r ? Math.round(ang * 180 / Math.PI) : '—';
  document.getElementById('ro-t').textContent = r ? t.toFixed(2) : '—';

  const c = centerOf();
  centerDot.position.copy(c);
  radiusLine.visible = !!r;

  const p0 = new THREE.Vector3(0, 0, 0);
  const p1 = r ? posAt(t) : p0;
  outDot.position.copy(p1);
  chordLine.geometry.dispose();
  chordLine.geometry = new THREE.BufferGeometry().setFromPoints([p0, p1]);
  chordLine.computeLineDistances();

  S.t = 0;
  trail.clear();
}

function resetAll() {
  S.t = 0;
  trail.clear();
  rebuild();
}

const ui = {
  v: document.getElementById('v'), b: document.getElementById('b'),
  vOut: document.getElementById('v-out'), bOut: document.getElementById('b-out'),
  qPos: document.getElementById('q-pos'), qNeg: document.getElementById('q-neg'),
};
ui.v.addEventListener('input', () => { S.v = +ui.v.value; ui.vOut.textContent = S.v.toFixed(2); markDrift(isDirty()); resetAll(); });
ui.b.addEventListener('input', () => { S.B = +ui.b.value; ui.bOut.textContent = S.B.toFixed(2); markDrift(isDirty()); resetAll(); });
function setQ(q) {
  S.q = q;
  qDirty = true;
  ui.qPos.setAttribute('aria-pressed', String(q > 0));
  ui.qNeg.setAttribute('aria-pressed', String(q < 0));
  markDrift(isDirty()); resetAll();
}
ui.qPos.addEventListener('click', () => setQ(1));
ui.qNeg.addEventListener('click', () => setQ(-1));

// θ 滑块（追加到面板最上方）
const thetaRow = document.createElement('div');
thetaRow.className = 'row';
thetaRow.innerHTML = '<label for="th">入射角 θ</label>'
  + '<input id="th" type="range" min="15" max="85" step="1" value="30">'
  + '<output id="th-out">30°</output>';
const panel = document.querySelector('.panel');
panel.insertBefore(thetaRow, panel.firstChild);
document.getElementById('th').addEventListener('input', ev => {
  S.theta = +ev.target.value * Math.PI / 180;
  document.getElementById('th-out').textContent = ev.target.value + '°';
  markDrift(isDirty()); resetAll();
});

onReset = () => { resetAll(); };

/* === END SCENE === */

/* ================= 主循环 ================= */
const clock = new THREE.Clock();
let firstFrame = true;
let holdTimer = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05) * speed;

  const r = radiusOf();
  const T_total = totalTime();

  if (!paused) {
    if (S.t < T_total) {
      S.t = Math.min(T_total, S.t + dt);
      trail.push(posAt(S.t));
    } else {
      holdTimer += dt;
      if (holdTimer > 1.2) { holdTimer = 0; resetAll(); }
    }

    const p = posAt(S.t);
    particle.position.copy(p);
    pLight.position.copy(p);

    const v = velAt(S.t);
    vArrow.position.copy(p);
    if (v.length() > 1e-6) vArrow.setDirection(v.clone().normalize());
    vArrow.setLength(Math.min(1.0, 0.25 + v.length() * 0.35), 0.14, 0.07);

    const c = centerOf();
    const toC = c.clone().sub(p);
    fArrow.position.copy(p);
    fArrow.visible = !!r;
    if (toC.length() > 1e-6) fArrow.setDirection(toC.normalize());

    if (r) {
      radiusLine.geometry.setFromPoints([c, p]);
      radiusLine.computeLineDistances();
    }
  }

  controls.update();
  renderer.render(scene, camera);

  if (firstFrame) { firstFrame = false; document.title = 'T2_OK'; }
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

rebuild();
animate();
</script>
</body>
</html>
